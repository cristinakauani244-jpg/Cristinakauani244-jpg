name: Generate Snake Animation

on:
  # Executa automaticamente a cada 12 horas para atualizar com seus novos commits
  schedule:
    - cron: "0 */12 * * *"
  
  # Permite rodar manualmente na aba Actions quando quiser
  workflow_dispatch:
  
  # Roda a cada push feito no repositório principal
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. Baixa o repositório
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Gera a animação da cobrinha com o seu gráfico de contribuições
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 3. Envia a animação gerada para uma branch chamada "output"
      - name: Push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
